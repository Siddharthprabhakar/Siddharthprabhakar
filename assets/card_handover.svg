.p{font:400 13.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#a1a1aa}
.c{font:600 11px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
.f{font:700 10px 'Courier New',monospace;fill:#71717a;letter-spacing:2px}
