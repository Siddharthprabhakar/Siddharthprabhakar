<rect x="90" y="132" width="86" height="22" rx="11" fill="#1f1f23" stroke="#3a3a40"/><text class="c" x="133" y="147" text-anchor="middle">TypeScript</text>
<rect x="184" y="132" width="78" height="22" rx="11" fill="#1f1f23" stroke="#3a3a40"/><text class="c" x="223" y="147" text-anchor="middle">Supabase</text>
<text class="f" x="20" y="176">SOLO / META AI HACKATHON</text>
