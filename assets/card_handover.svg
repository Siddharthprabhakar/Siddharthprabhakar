<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190" role="img" aria-label="Handover, a project memory app for research labs">
<title>Handover</title>
<style>
.k{font:700 11px 'Courier New',monospace;fill:#ff3b3b;letter-spacing:3px}
