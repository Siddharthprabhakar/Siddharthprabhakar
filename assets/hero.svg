<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Siddharth Prabhakar, UX engineer and HCI researcher">
<title>Siddharth Prabhakar, UX engineer and HCI researcher</title>
<style>
.n{font:800 46px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:2px}
.s{font:500 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e4e4e7;letter-spacing:5px}
.t{font:700 12px 'Courier New',monospace;fill:#ff3b3b;letter-spacing:5px}
@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.bar{animation:sweep 4.5s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
</style>
<rect width="900" height="240" fill="#0b0b0c"/>
<polygon points="540,0 900,0 900,240 400,240" fill="#b3001b"/>
<polygon points="650,0 900,0 900,240 510,240" fill="#e11d2e" opacity=".6"/>
<g stroke="#ffffff" stroke-opacity=".05">
<line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/><line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/><line x1="0" y1="200" x2="900" y2="200"/>
</g>
<text class="n" x="48" y="108">SIDDHARTH PRABHAKAR</text>
<text class="s" x="50" y="148">UX ENGINEER + HCI RESEARCHER</text>
<rect class="bar" x="0" y="172" width="160" height="3" fill="#ff3b3b"/>
<text class="t" x="50" y="204" style="fill:#a1a1aa">M.S. HCI / INDIANA UNIVERSITY INDIANAPOLIS / MAY 2027</text>
</svg>
